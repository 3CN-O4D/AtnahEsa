<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>AseHanta — You’re offline</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(160deg, #0b1f3a 0%, #123b6b 60%, #1d4ed8 100%);
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        width: min(100%, 420px);
        padding: 32px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #dbeafe; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #d4af37;
        color: #0b1f3a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="AseHanta" />
      <h1>You’re offline</h1>
      <p>Your saved AseHanta page isn’t available yet. Reconnect and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
